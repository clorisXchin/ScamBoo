<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>ScamBoo · Tetapan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ScamBoo">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">
  <main class="page">
    <h1 class="page-title" data-bm="Tetapan" data-en="Settings"></h1>

    <!-- Easy to read: for everyone -->
    <section class="section">
      <div class="section-head"><h3 data-bm="Senang dibaca" data-en="Easy to read"></h3></div>
      <p class="muted" style="margin-bottom:8px" data-bm="Saiz tulisan" data-en="Text size"></p>
      <div class="seg" id="size">
        <button data-v="m" style="font-size:1rem">A</button>
        <button data-v="l" style="font-size:1.25rem">A+</button>
        <button data-v="xl" style="font-size:1.5rem">A++</button>
      </div>
      <div class="card list" style="margin-top:12px">
        <button class="item" id="contrastRow" style="width:100%;text-align:left"><span class="avatar av-teal" data-icon="eye"></span>
          <div class="grow"><b data-bm="Warna lebih jelas" data-en="High contrast"></b><small data-bm="Hitam putih, garisan lebih tebal" data-en="Black and white, thicker lines"></small></div>
          <span class="switch" id="contrastSw"></span></button>
        <button class="item" id="readRow" style="width:100%;text-align:left"><span class="avatar av-teal" data-icon="speaker"></span>
          <div class="grow"><b data-bm="Butang baca kuat" data-en="Read-aloud button"></b><small data-bm="Telefon bacakan skrin untuk anda" data-en="The phone reads the screen to you"></small></div>
          <span class="switch" id="readSw"></span></button>
        <button class="item" id="voiceRow" style="width:100%;text-align:left"><span class="avatar av-teal" data-icon="bot"></span>
          <div class="grow"><b data-bm="Amaran suara semasa panggilan" data-en="Spoken warnings during calls"></b><small data-bm="Bisikan ke telinga + getaran bila ada bahaya" data-en="A whisper in your ear + vibration when there's danger"></small></div>
          <span class="switch" id="voiceSw"></span></button>
      </div>
      <p class="muted" style="margin:14px 0 8px" data-bm="Bahasa" data-en="Language"></p>
      <div class="seg" id="lang">
        <button data-v="bm">Bahasa Malaysia</button>
        <button data-v="en">English</button>
      </div>
    </section>

    <!-- Guardian: protection setup -->
    <section class="section" id="guardSec">
      <div class="section-head"><h3 data-bm="Perlindungan (Guardian)" data-en="Protection (Guardian)"></h3></div>
      <div class="seg" id="mode">
        <button data-v="jaga_penuh">Jaga Penuh</button>
        <button data-v="standard">Standard</button>
      </div>
      <div class="card" style="margin-top:10px" id="modeInfo"></div>
      <p class="muted" style="margin:14px 0 8px" data-bm="AI ambil alih secara automatik selepas" data-en="The AI takes over automatically after"></p>
      <div class="seg" id="countdown">
        <button data-v="5" data-bm="5 saat" data-en="5 sec"></button>
        <button data-v="10" data-bm="10 saat" data-en="10 sec"></button>
        <button data-v="0" data-bm="Tutup" data-en="Off"></button>
      </div>
      <p class="tiny" style="margin-top:6px" data-bm="Hanya untuk risiko tinggi dalam Jaga Penuh. Butang 'Batal' sentiasa ada." data-en="Only on high risk in Jaga Penuh. A 'Cancel' button is always shown."></p>
      <div class="card list" style="margin-top:12px">
        <div class="item"><span class="avatar av-violet" data-icon="family"></span>
          <div class="grow"><b data-bm="Kenalan kecemasan" data-en="Emergency contact"></b><small>Amir (anak) · 012-000 4471</small></div></div>
      </div>
    </section>

    <section class="section">
      <button class="invite" id="inviteBtn"><img src="assets/brand/ghost-96.png" alt="">
        <span><b data-bm="Kongsi dengan keluarga" data-en="Share with family"></b>
        <small data-bm="Ajak orang tersayang guna ScamBoo" data-en="Invite loved ones to use ScamBoo"></small></span>
        <span class="go" data-icon="share"></span></button>
    </section>

    <section class="section">
      <div class="section-head"><h3 data-bm="Janji privasi kami" data-en="Our privacy promise"></h3></div>
      <div class="card list" data-read>
        <div class="item"><span class="avatar av-green" data-icon="lock"></span><div class="grow"><b data-bm="Kekal dalam telefon anda" data-en="Stays on your phone"></b><small data-bm="Suara dianalisis dalam telefon, tidak dirakam." data-en="Voice is analysed on the phone, never recorded."></small></div></div>
        <div class="item"><span class="avatar av-green" data-icon="eye"></span><div class="grow"><b data-bm="Nombor tidak dikenali sahaja" data-en="Unknown numbers only"></b><small data-bm="Kami tak dengar panggilan dari kenalan anda." data-en="We never listen to calls from your contacts."></small></div></div>
        <div class="item"><span class="avatar av-green" data-icon="bank"></span><div class="grow"><b data-bm="Bank hanya dengan izin anda" data-en="Your bank only with your consent"></b><small data-bm="Tiada data dihantar tanpa persetujuan anda." data-en="Nothing is sent without your OK."></small></div></div>
      </div>
    </section>

    <section class="section center stack">
      <a class="btn btn-outline btn-block" href="onboarding.html" data-bm="Ulang persediaan" data-en="Run setup again"></a>
      <button class="btn btn-ghost" id="resetDemo" data-bm="Set semula data demo" data-en="Reset demo data"></button>
      <p class="tiny" data-bm="Prototaip reka bentuk · data contoh sahaja" data-en="Design prototype · sample data only"></p>
    </section>
  </main>
</div>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  UI.mount("settings");
  document.getElementById("inviteBtn").onclick = () => UI.shareInvite();
  if (UI.elder()) document.getElementById("guardSec").classList.add("hidden");  // elders can't weaken their own protection
  const INFO = {
    jaga_penuh: ["<b>Untuk warga emas 55+.</b> Amaran lebih awal. Kalau bahaya tinggi dan tiada jawapan, AI ambil alih secara automatik.",
                 "<b>For seniors 55+.</b> Earlier warnings. On high danger with no answer, the AI takes over automatically."],
    standard: ["<b>Untuk kebanyakan orang.</b> Amaran bila benar-benar perlu. Anda sentiasa pilih sendiri.",
               "<b>For most people.</b> Warnings only when really needed. You always choose yourself."],
  };
  const seg = (id, key, after) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    const v = key === "countdown" ? +b.dataset.v : b.dataset.v;
    Store.set({ [key]: v }); after ? after() : paint();
  });
  seg("size", "size", () => { UI.applyPrefs(); paint(); });
  seg("lang", "lang", () => location.reload());
  seg("mode", "mode", () => location.reload());
  seg("countdown", "countdown");
  const toggle = (row, key, after) => document.getElementById(row).onclick = () => {
    const cur = Store.settings()[key];
    Store.set({ [key]: key === "contrast" ? (cur === "high" ? "normal" : "high") : !cur });
    after ? after() : paint();
  };
  toggle("contrastRow", "contrast", () => { UI.applyPrefs(); paint(); });
  toggle("readRow", "readAloud", () => location.reload());
  toggle("voiceRow", "voice");
  function paint() {
    const s = Store.settings();
    const on = (id, v) => document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle("on", b.dataset.v === String(v)));
    on("size", s.size); on("lang", s.lang); on("mode", s.mode); on("countdown", s.countdown);
    document.getElementById("modeInfo").innerHTML = `<p>${UI.t(INFO[s.mode])}</p>`;
    document.getElementById("contrastSw").classList.toggle("on", s.contrast === "high");
    document.getElementById("readSw").classList.toggle("on", !!s.readAloud);
    document.getElementById("voiceSw").classList.toggle("on", !!s.voice);
  }
  document.getElementById("resetDemo").onclick = () => { Store.resetCalls(); UI.toast(UI.t(["Data demo diset semula", "Demo data reset"])); };
  paint();
</script>
</body>
</html>
