<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>ScamBoo · Sejarah</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ScamBoo">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">
  <main class="page">
    <h1 class="page-title" data-bm="Sejarah panggilan" data-en="Call history"></h1>
    <p class="page-sub" data-bm="Setiap panggilan dari nombor tidak dikenali yang kami semak." data-en="Every call from an unknown number we checked."></p>

    <section class="section">
      <div class="seg" id="filter">
        <button class="on" data-f="all" data-bm="Semua" data-en="All"></button>
        <button data-f="risk" data-bm="Berisiko" data-en="Risky"></button>
        <button data-f="safe" data-bm="Selamat" data-en="Safe"></button>
      </div>
    </section>

    <section class="section"><div class="card list" id="list"></div></section>

    <section class="section">
      <div class="card" style="background:var(--navy);color:#fff">
        <div class="row"><span class="avatar" style="background:rgba(255,255,255,.12);color:#fff" data-icon="users"></span>
          <div class="grow"><b data-bm="Komuniti melindungi anda" data-en="The community protects you"></b>
          <p style="opacity:.8;font-size:15px" data-bm="Bila 3 orang lapor nombor yang sama, semua pengguna dapat amaran awal." data-en="When 3 people report the same number, every user gets an early warning."></p></div></div>
      </div>
    </section>
  </main>
</div>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  UI.mount("history");
  if (!UI.elder()) { document.querySelector(".page-title").textContent = UI.t(["Amaran Mak Rosnah", "Mak Rosnah's alerts"]); }
  const AV = { HIGH: "av-red", MEDIUM: "av-orange", NOT_SURE: "av-teal", LOW: "av-green" };
  const IC = { HIGH: "shieldAlert", MEDIUM: "shieldAlert", NOT_SURE: "phone", LOW: "shield" };
  let f = "all";
  function render() {
    const calls = Store.calls().filter(c => f === "all" || (f === "risk" ? ["HIGH", "MEDIUM"].includes(c.tier) : !["HIGH", "MEDIUM"].includes(c.tier)));
    document.getElementById("list").innerHTML = calls.map(c => `
      <div class="item"><span class="avatar ${AV[c.tier]}">${UI.I[IC[c.tier]]}</span>
        <div class="grow"><b>${UI.t(c.label)}</b><small>${c.name} · ${UI.L() ? c.whenEn : c.when}</small>
          <div class="chips" style="margin-top:6px">${UI.tierBadge(c.tier)}
            ${c.ai ? `<span class="badge b-violet">👻 ${UI.t(["Boo ambil alih", "Boo took over"])}</span>` : ""}
            ${c.warned && !UI.elder() ? `<span class="badge b-teal">⏱ ${c.warned}s ${UI.t(["lebih awal", "early"])}</span>` : ""}
            ${c.reports ? `<span class="badge b-grey">${c.reports} ${UI.t(["orang lapor", "people reported"])}</span>` : ""}</div></div></div>`).join("")
      || `<p class="tiny center">${UI.t(["Tiada panggilan", "No calls"])}</p>`;
  }
  document.querySelectorAll("#filter button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#filter button").forEach(x => x.classList.remove("on")); b.classList.add("on"); f = b.dataset.f; render();
  });
  render();
</script>
</body>
</html>
