<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>ScamBoo · Sambungan makmal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">
  <main class="page">
    <span class="badge b-violet" data-bm="Untuk pasukan & juri" data-en="For the team & judges"></span>
    <h1 class="page-title" style="margin-top:10px" data-bm="Sambungan makmal AI" data-en="AI lab connection"></h1>
    <p class="page-sub" data-bm="Reka bentuk ScamBoo guna model sebenar pasukan melalui pelayan pasukan (/api/test). Kunci GPU kekal di pelayan." data-en="The ScamBoo design uses the team's real models through the team server (/api/test). GPU keys stay on the server."></p>

    <section class="section"><div class="card list" id="svcs"></div>
      <button class="btn btn-outline btn-block" id="recheck" style="margin-top:10px" data-bm="Semak semula" data-en="Check again"></button></section>

    <section class="section">
      <div class="section-head"><h3 data-bm="Kunci akses pasukan" data-en="Team access key"></h3></div>
      <p class="muted" style="margin-bottom:8px" data-bm="Bila GPU disambung, pelayan minta kunci akses (SCAMBOO_ACCESS_KEY). Ia disimpan dalam telefon ini sahaja." data-en="When a GPU is connected, the server asks for the access key (SCAMBOO_ACCESS_KEY). It's kept on this phone only."></p>
      <div class="lookup"><input class="input" id="akey" type="password" autocomplete="off" aria-label="Access key">
        <button class="btn btn-navy" id="akeySave" data-bm="Simpan" data-en="Save"></button></div>
    </section>

    <section class="section">
      <div class="section-head"><h3 data-bm="Cuba Qwen C1 (risiko)" data-en="Try Qwen C1 (risk)"></h3></div>
      <textarea class="input" id="c1in" rows="4">Saya pegawai polis dari Bukit Aman. Jangan beritahu sesiapa. Bagi saya TAC sekarang dan pindah wang ke akaun selamat.</textarea>
      <div class="btn-grid" style="margin-top:10px">
        <button class="btn btn-primary" id="c1go" data-bm="Semak risiko" data-en="Check risk"></button>
        <button class="btn btn-outline" id="c1normal" data-bm="Contoh biasa" data-en="Ordinary example"></button></div>
      <div id="c1out"></div>
    </section>

    <section class="section">
      <div class="section-head"><h3 data-bm="Cuba Qwen C2 + suara" data-en="Try Qwen C2 + voices"></h3></div>
      <div class="btn-grid">
        <button class="btn btn-outline" id="c2go" data-bm="Ayat ejen (C2)" data-en="Agent line (C2)"></button>
        <button class="btn btn-outline" id="fish" data-bm="Dengar Fish" data-en="Play Fish"></button></div>
      <button class="btn btn-outline btn-block" id="cbox" style="margin-top:10px" data-bm="Dengar Chatterbox (panduan)" data-en="Play Chatterbox (guidance)"></button>
      <div id="c2out"></div>
    </section>

    <section class="section stack">
      <a class="btn btn-primary btn-block" href="call.html?judge" data-bm="Buka panggilan latihan (paparan juri)" data-en="Open the practice call (judge view)"></a>
      <p class="tiny" data-bm="Skor ialah skor bukti berwajaran dari tetapan makmal, bukan kebarangkalian yang ditentukur." data-en="The score is a weighted evidence score from the lab settings, not a calibrated probability."></p>
    </section>
  </main>
</div>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/lab-config.js"></script>
<script src="assets/js/live.js"></script>
<script>
  UI.mount("settings", { skipOnboarding: true });
  const { t } = UI, $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const row = (state, name, note) => `<div class="svc"><span class="dot ${state}"></span><div class="grow"><b>${name}</b><small>${note}</small></div></div>`;
  const fail = e => `<div class="result" style="background:var(--brand-bg);color:var(--brand-2);margin-top:10px"><b>✗ ${esc(e.message)}</b></div>`;

  async function check() {
    const box = $("svcs");
    if (!Live.configured()) {
      box.innerHTML = row("bad", t(["Belum disambung", "Not connected"]), t(["Mod reka bentuk (lab-config.js: base = null).", "Design mode (lab-config.js: base = null)."]));
      return;
    }
    box.innerHTML = row("wait", t(["Pelayan pasukan", "Team server"]), esc(Live.api) + " …");
    try {
      await Live.ready();
      const st = Live.status();
      if (!st) throw new Error(t(["Laluan tidak menjawab. Buka aplikasi ini melalui pelayan Next.js pasukan (npm run dev → /scamboo/).", "The route didn't answer. Open this app through the team's Next.js server (npm run dev → /scamboo/)."]));
      const s = Live.settings();
      box.innerHTML = [
        row("ok", t(["Pelayan pasukan", "Team server"]), esc(Live.api)),
        row(st.c1 ? "ok" : "wait", "Qwen C1 · " + t(["risiko", "risk"]), st.c1 ? t(["GPU disambung", "GPU connected"]) : t(["Tiada GPU: pelayan beri jawapan contoh", "No GPU: the server answers with examples"])),
        row(st.c2 ? "ok" : "wait", "Qwen C2 · " + t(["ejen", "agent"]), st.c2 ? t(["GPU disambung", "GPU connected"]) : t(["Tiada GPU: pelayan beri jawapan contoh", "No GPU: the server answers with examples"])),
        row(Live.voiceRoute() ? "ok" : "wait", "Fish / Chatterbox", Live.voiceRoute() ? "OK" : t(["Belum ada laluan suara dalam repo: guna suara telefon", "No voice route in the repo yet: using the phone's voice"])),
        row("ok", t(["Tetapan", "Settings"]), `${t(["ambang", "threshold"])} ${esc(s.threshold)} · ${esc(Object.entries(s.weights).map(([k, v]) => k + " " + v).join(", "))} · ${esc(Live.revision())}`),
      ].join("");
    } catch (e) { box.innerHTML = row("bad", t(["Pelayan pasukan", "Team server"]), esc(e.message)); }
  }

  async function c1(text) {
    $("c1out").innerHTML = `<p class="tiny" style="margin-top:10px">${t(["Menyemak…", "Checking…"])}</p>`;
    try {
      const r = await Live.risk([{ who: "caller", text, t: 5 }]);
      $("c1out").innerHTML = `<div class="result" style="background:${r.crossed ? "var(--brand-bg)" : "var(--green-bg)"};margin-top:10px">
        <b>${r.crossed ? t(["Melepasi ambang", "Over the threshold"]) : t(["Bawah ambang", "Below the threshold"])}</b>:
        ${t(["skor", "score"])} ${r.score} / ${r.threshold} · ${r.mode === "mock" ? t(["contoh pelayan", "server example"]) : "Qwen C1"} · ${r.ms} ms
        ${r.evidence.map(e => `<div class="tiny" style="margin-top:6px"><b>${esc(t([e.label, e.labelEn]))}</b> (${e.weight}) ${e.quote ? "“" + esc(e.quote) + "”" : ""}</div>`).join("")}</div>`;
    } catch (e) { $("c1out").innerHTML = fail(e); }
  }
  $("c1go").onclick = () => c1($("c1in").value);
  $("c1normal").onclick = () => { $("c1in").value = "Hello puan, saya dari Pos Laju. Bungkusan puan sampai petang ni, puan ada di rumah tak?"; c1($("c1in").value); };
  const turns = () => [{ who: "caller", text: $("c1in").value, t: 5 }];
  $("c2go").onclick = async () => {
    $("c2out").innerHTML = `<p class="tiny" style="margin-top:10px">…</p>`;
    try { const a = await Live.agent(turns(), "caller"); $("c2out").innerHTML = `<div class="result" style="background:var(--soft);margin-top:10px">“${esc(a.text)}” · ${a.mode === "mock" ? t(["contoh pelayan", "server example"]) : "Qwen C2"} · ${a.ms} ms</div>`; }
    catch (e) { $("c2out").innerHTML = fail(e); }
  };
  const play = (engine, text) => async () => {
    $("c2out").innerHTML = `<p class="tiny" style="margin-top:10px">${engine}…</p>`;
    try { const r = await Live.say(text, engine, "ms"); $("c2out").innerHTML = `<div class="result" style="background:var(--green-bg);margin-top:10px">✓ ${r.device ? t(["Suara telefon (laluan " + engine + " belum ada)", "Phone voice (no " + engine + " route yet)"]) : engine}</div>`; }
    catch (e) { $("c2out").innerHTML = fail(e); }
  };
  $("akey").value = Live.accessKey.get();
  $("akeySave").onclick = () => { Live.accessKey.set($("akey").value.trim()); UI.toast(t(["Kunci disimpan dalam telefon ini", "Key saved on this phone"])); };
  $("fish").onclick = play("fish", "Hello encik, sekejap ya, saya tengah cari cermin mata.");
  $("cbox").onclick = play("chatterbox", "Mak, jangan risau. Boo sedang bercakap dengan pemanggil. Jangan beri TAC.");
  $("recheck").onclick = check;
  check();
</script>
</body>
</html>
